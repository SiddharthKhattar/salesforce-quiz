<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salesforce Admin Practice & 55-Q Mock Exam</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f9;
      color: #1e293b;
      margin: 0;
      padding: 0;
      line-height: 1.5;
    }
    header {
      z-index: 100;
      background: #ffffff;
      border-bottom: 1px solid #cbd5e1;
      padding: 12px 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .mode-tabs {
      max-width: 960px;
      margin: 0 auto 12px;
      display: flex;
      gap: 10px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 10px;
    }
    .mode-tab {
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #475569;
      cursor: pointer;
    }
    .mode-tab.active {
      background: #1e40af;
      color: #ffffff;
      border-color: #1e40af;
    }
    .top-bar {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .score-box {
      font-weight: 600;
      font-size: 0.92rem;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .score-pill {
      background: #eff6ff;
      color: #1d4ed8;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #bfdbfe;
    }
    .status-pill {
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 700;
    }
    .status-progress {
      background: #fef9c3;
      color: #854d0e;
      border: 1px solid #fde047;
    }
    .status-pass {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }
    .status-fail {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 8px 13px;
      font-size: 0.88rem;
      font-weight: 600;
      transition: background 0.15s;
    }
    .btn-shuffle {
      background: #ede9fe;
      color: #5b21b6;
      border: 1px solid #ddd6fe;
    }
    .btn-shuffle:hover { background: #ddd6fe; }
    .btn-grade-all {
      background: #059669;
      color: #ffffff;
    }
    .btn-grade-all:hover { background: #047857; }
    .btn-reset-cat {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
    }
    .btn-reset-cat:hover { background: #e2e8f0; }
    .btn-reset-all {
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }
    .btn-reset-all:hover { background: #fecaca; }
    .cat-nav {
      max-width: 960px;
      margin: 12px auto 0;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .cat-btn {
      background: #f8fafc;
      color: #475569;
      border: 1px solid #cbd5e1;
      padding: 6px 11px;
      font-size: 0.82rem;
      border-radius: 6px;
    }
    .cat-btn.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }
    main {
      max-width: 960px;
      margin: 24px auto 60px;
      padding: 0 16px;
    }
    .cat-header {
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .cat-header h2 { margin: 0; font-size: 1.35rem; }
    .mock-banner {
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 20px;
      display: none;
    }
    .mock-banner.pass {
      display: block;
      border-color: #22c55e;
      background: #f0fdf4;
      color: #14532d;
    }
    .mock-banner.fail {
      display: block;
      border-color: #ef4444;
      background: #fef2f2;
      color: #7f1d1d;
    }
    .q-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 18px 20px;
      margin-bottom: 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .q-title {
      font-weight: 600;
      margin-bottom: 12px;
      font-size: 1rem;
    }
    .badge {
      display: inline-block;
      font-size: 0.78rem;
      padding: 2px 8px;
      border-radius: 4px;
      background: #e0e7ff;
      color: #3730a3;
      margin-right: 6px;
      vertical-align: middle;
    }
    .badge-cat {
      display: inline-block;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      background: #f1f5f9;
      color: #475569;
      margin-right: 6px;
      vertical-align: middle;
      font-weight: 500;
    }
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }
    .opt-label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 9px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      transition: background 0.1s;
    }
    .opt-label:hover { background: #f8fafc; }
    .opt-label input { margin-top: 4px; transform: scale(1.15); }
    .opt-label.correct {
      background: #dcfce7;
      border-color: #22c55e;
      color: #14532d;
      font-weight: 600;
    }
    .opt-label.wrong {
      background: #fee2e2;
      border-color: #ef4444;
      color: #7f1d1d;
    }
    .btn-check {
      background: #2563eb;
      color: white;
    }
    .btn-check:hover { background: #1d4ed8; }
    .btn-check:disabled {
      background: #94a3b8;
      cursor: default;
    }
    .feedback {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.9rem;
      display: none;
    }
    .feedback.pass {
      display: block;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
    }
    .feedback.fail {
      display: block;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<header>
  <!-- Mode Switcher Tabs -->
  <div class="mode-tabs">
    <button class="mode-tab active" id="tabCatBtn" onclick="switchMode('category')">📚 Category Practice (10 Categories)</button>
    <button class="mode-tab" id="tabMockBtn" onclick="switchMode('mock')">🎯 Mock Exam (55 Random Qs • 70% to Pass)</button>
  </div>

  <!-- Category Practice Top Bar -->
  <div id="catTopBar">
    <div class="top-bar">
      <div class="score-box">
        <span class="score-pill" id="catScore">Category: 0 / 0 (0%)</span>
        <span class="score-pill" id="totalScore">Total: 0 / 0 (0%)</span>
      </div>
      <div class="btn-group">
        <button class="btn-shuffle" onclick="shuffleCurrentCategory()">🔀 Shuffle Category</button>
        <button class="btn-reset-cat" onclick="resetCurrentCategory()">Reset Category</button>
        <button class="btn-reset-all" onclick="resetAllCategories()">Restart All Categories</button>
      </div>
    </div>
    <div class="cat-nav" id="catNav"></div>
  </div>

  <!-- Mock Exam Top Bar -->
  <div id="mockTopBar" class="hidden">
    <div class="top-bar">
      <div class="score-box">
        <span class="score-pill" id="mockProgress">Answered: 0 / 55</span>
        <span class="score-pill" id="mockScore">Score: 0 / 55 (0%)</span>
        <span class="status-pill status-progress" id="mockPassBadge">Pass Target: 70% (39/55)</span>
      </div>
      <div class="btn-group">
        <button class="btn-grade-all" onclick="gradeAllMock()">✅ Grade All Answers</button>
        <button class="btn-reset-all" onclick="generateNewMockExam()">🔄 New 55-Q Mock Exam</button>
      </div>
    </div>
  </div>
</header>

<main>
  <!-- Category View -->
  <div id="categoryView">
    <div class="cat-header">
      <h2 id="catTitle">Category</h2>
    </div>
    <div id="questionsContainer"></div>
  </div>

  <!-- Mock Exam View -->
  <div id="mockView" class="hidden">
    <div class="cat-header">
      <h2>🎯 Mock Exam: 55 Random Questions (Need 70% / 39 Correct to Pass)</h2>
    </div>
    <div id="mockResultBanner" class="mock-banner"></div>
    <div id="mockQuestionsContainer"></div>
    <div style="margin-top: 20px; display: flex; gap: 12px;">
      <button class="btn-grade-all" style="padding: 12px 20px; font-size: 1rem;" onclick="gradeAllMock()">✅ Submit & Grade All 55 Questions</button>
      <button class="btn-reset-all" style="padding: 12px 20px; font-size: 1rem;" onclick="generateNewMockExam()">🔄 Generate New 55-Q Mock Exam</button>
    </div>
  </div>
</main>

<script>
const QUIZ_DATA = [
  // ================= CATEGORY 1: REPORTS & DASHBOARDS =================
  {
    category: "1. Reports & Dashboards",
    questions: [
      { id: 1, req: 1, q: "Cloud Kicks wants a report to categorize accounts into small, medium, and large based on the dollar value found in the Contract Value field. Which feature should a Platform Administrator use to meet this request?", options: ["A. Group Rows", "B. Filter Logic", "C. Detail Column", "D. Bucket Column"], ans: ["D"], hook: "Group values into small/medium/large" },
      { id: 3, req: 1, q: "Cloud Kicks is concerned that not everyone on the sales team is entering key data into accounts and opportunities that they own, and that if key information changes, it does not get updated in Salesforce. A Platform Administrator wants to get a better understanding of their data quality and record completeness. What should the administrator do to accomplish this?", options: ["A. Explore AppExchange for data quality and record completeness solutions.", "B. Create a report for Accounts and Opportunities highlighting missing data.", "C. Subscribe the sales reps to a monthly report for accounts and opportunities.", "D. Configure the key fields as required fields on the page layout."], ans: ["B"], hook: "\"Understand\" means report" },
      { id: 12, req: 1, q: "Northern Trail Outfitters has the Case object set to private. The support manager raised a concern that reps have a broader view of data than expected and can see all cases on their group's dashboards. What is causing reps to have inappropriate access to data on dashboards?", options: ["A. Dashboard Filters", "B. Public Dashboards", "C. Dashboard's running user", "D. Dashboard Subscriptions"], ans: ["C"], hook: "Reps see what the running user sees" },
      { id: 26, req: 1, q: "How should a Platform Administrator provide users with individualized views of data on a dashboard?", options: ["A. Add a Dashboard Filter to change the dashboard view.", "B. Create a Dynamic Dashboard.", "C. Set View Dashboard As to Me.", "D. Set View Dashboard As to Another person."], ans: ["B"], hook: "Each viewer sees their own data" },
      { id: 33, req: 1, q: "A sales manager at Cloud Kicks would like a dashboard to emphasize some important data and tell a more compelling data story to the sales reps. How should a Platform Administrator achieve this for the sales manager?", options: ["A. Use a Text Widget.", "B. Assign a new Task to each rep.", "C. Use the Highlights Panel.", "D. Send out a mass email."], ans: ["A"], hook: "Adds emphasis and story" },
      { id: 45, req: 1, q: "A Platform Administrator wants to limit the kinds of reports their users can create. Which tool should the administrator use?", options: ["A. Hide Report Types", "B. Report Folder Sharing", "C. Standard Report Types", "D. Joined Report"], ans: ["A"], hook: "Limits what users can build" },
      { id: 52, req: 1, q: "Management at Universal Containers would like to share dashboard components with their team in Chatter but currently does not have access to this capability. How should a Platform Administrator make this functionality available to management?", options: ["A. Enable reporting snapshots.", "B. Select Download Chart on the component.", "C. Set View Dashboard As to the dashboard viewer.", "D. Enable dashboard feed tracking."], ans: ["D"], hook: "Needed to share components in Chatter" },
      { id: 57, req: 1, q: "A sales manager receives a URL to a Dashboard folder containing several dashboards. However, when the sales manager clicks on the URL, a message appears stating, \"We couldn't find the record you're trying to access.\" What is the reason for this?", options: ["A. The sales manager does not have the correct permission set.", "B. The sales manager needs the correct sales user profile.", "C. The Dashboard folder is set to Private.", "D. View access has not been granted to the Dashboard folder."], ans: ["D"], hook: "\"Couldn't find record\" means no folder access" },
      { id: 75, req: 1, q: "A group of sales reps can view each other's orders on a report; however, they would like a report to view just their own orders. What should a Platform Administrator do to set up a report for the sales reps?", options: ["A. Set the Opportunity Filter for Primary as True.", "B. Filter by Opportunity Owner equals $USER.", "C. Set Organization Wide Defaults of Order object to Private.", "D. Save the report in a private folder for the user."], ans: ["B"], hook: "\"My\" records only" },
      { id: 78, req: 1, q: "Cloud Kicks has three teams of customer service reps that use a custom field on the Case object to populate the team assigned to manage the tickets. The customer support manager would like a Custom Dashboard to show data specific to each team. What should a Platform Administrator do to meet this requirement?", options: ["A. Create separate Dashboards for each Customer Support team.", "B. Create a Dashboard with widgets specific to each team.", "C. Create a Dashboard that uses Dashboard filters to show specific team data.", "D. Add Cross Filters to switch between the three customer service teams."], ans: ["C"], hook: "One dashboard, filtered per team" },
      { id: 85, req: 1, q: "A sales rep wants to be able to categorize multiple picklist values into a single value on a report. Which option should a Platform Administrator suggest to the sales rep to accomplish this?", options: ["A. Bucket Column", "B. Unique Count", "C. Report Filter", "D. Chart"], ans: ["A"], hook: "Group values into categories" },
      { id: 101, req: 1, q: "Users at DreamHouse Realty are only allowed to see opportunities they own. Leadership wants an enterprise-wide dashboard of all open opportunities in the pipeline so that users can see how the company is performing at any point in time. How should a Platform Administrator create the dashboard without changing any sharing settings?", options: ["A. Create a dashboard with the running user set as someone who can see all opportunities.", "B. Add a filter to the dashboard to filter the opportunities by owner role.", "C. Build individual dashboards for profiles that need to see the enterprise results.", "D. Update the dashboard folder settings to manager for the sales reps role."], ans: ["A"], hook: "Changes no sharing settings" },
      { id: 121, req: 1, q: "A sales rep typically has several open opportunities for each of their accounts. Which tool should a Platform Administrator suggest to the sales rep to obtain the total number of accounts associated with open opportunities in a report?", options: ["A. Bucket Column", "B. Report Filter", "C. Unique Count", "D. Group Rows"], ans: ["C"], hook: "Counts distinct accounts" },
      { id: 136, req: 1, q: "A Platform Administrator at Cloud Kicks needs to temporarily remove one dashboard from a shared folder with several dashboards to make some required changes. How should the administrator achieve this?", options: ["A. Remove View access to the shared folder.", "B. Edit the dashboard properties and move it to a private dashboards folder.", "C. Remove the permission set to the dashboard from the users.", "D. Create a private group and add the dashboard to it."], ans: ["B"], hook: "Temporary removal" },
      { id: 139, req: 1, q: "The call center manager at Ursa Major Solar wants to provide agents with a case dashboard that can be drilled down by case origin, status, and owner. What should a Platform Administrator add to the dashboard to fulfill the request?", options: ["A. Dashboard Filter", "B. Dashboard Widget", "C. Combination Chart", "D. Bucket Column"], ans: ["A"], hook: "Drill by origin, status, owner" },
      { id: 145, req: 1, q: "The sales and service teams at Cloud Kicks would like to have more visibility into their pipeline and stay on top of every case. A Platform Administrator needs to quickly create dashboards for each of the teams but does not know where to start. What should the administrator do?", options: ["A. Use the Salesforce Labs Field Service Dashboards for service teams from AppExchange.", "B. Enable Einstein Analytics and build custom dashboards using advanced analytics tools.", "C. Use the Salesforce Labs CRM Dashboards for sales teams from AppExchange.", "D. Manually create dashboards without using any prebuilt templates or packages."], ans: ["C"], hook: "Prebuilt, so don't start from scratch" }
    ]
  },

  // ================= CATEGORY 2: AGENTFORCE =================
  {
    category: "2. Agentforce",
    questions: [
      { id: 11, req: 1, q: "Cloud Kicks has implemented an Employee Agent to answer benefits questions for its employees. How should a Platform Administrator prevent the agent from responding to staff members' questions about the CEO's private health plan and benefits?", options: ["A. Configure assignment rules to assign the agent to employee data.", "B. Ensure the users' permissions and field-level security restrict access to the CEO's health plan.", "C. Modify the agent's instructions and guardrails to block questions related to the CEO's health plan.", "D. Train the agent on employee health plans instead of the CEO's health plan."], ans: ["B"], hook: "Agents inherit user access, and instructions are not security" },
      { id: 41, req: 1, q: "A Platform Administrator is building an agent to nurture leads. How does Agentforce SDR help?", options: ["A. Generate a dynamic call script and talking points for the human sales reps to use.", "B. Autonomously negotiate pricing with the lead and close the final deal.", "C. Analyze the performance of human sales reps and provide coaching tips.", "D. Answer the lead's questions with responses that are grounded in company data."], ans: ["D"], hook: "SDR nurtures leads using company data (Corrected)" },
      { id: 46, req: 1, q: "Agentforce is escalating cases to the support team, but the support team complains they have no context and have to ask the customer to repeat everything. Which configuration issue is the most likely cause of this issue?", options: ["A. The support team members are missing the Agentforce User permission set.", "B. The support team's case page layout is missing the agent history component.", "C. The agent's instructions are preventing the history and context from being saved.", "D. The handoff is creating a new case instead of transferring the existing session."], ans: ["D"], hook: "Handoff creating a new case loses context" },
      { id: 51, req: 1, q: "A Platform Administrator created a new prompt template and is testing it. Every time the administrator tests the template, it gives a different response. Why is the prompt template giving different responses each time it's run?", options: ["A. Prompt Builder caches the large language model's response, so the prompt is only sent once for every template the administrator creates.", "B. Every time the administrator runs a prompt template in Prompt Builder, it creates a unique call to the large language model.", "C. The prompt is only sent to the large language model after the administrator deploys the template to a live agent, not when the prompt is run in the builder.", "D. Prompt Builder runs a simulated call to the large language model to save on costs, so the prompt is never sent to the actual model."], ans: ["B"], hook: "Each run is a unique LLM call" },
      { id: 54, req: 1, q: "What is an Agentforce use case in a sales organization?", options: ["A. Generating cold calls", "B. Automating all marketing content", "C. Providing basic web bot chats", "D. Automating Lead Qualification"], ans: ["D"], hook: "Sales use case" },
      { id: 63, req: 1, q: "A Platform Administrator is creating a new action instruction for an agent. This action, named createCase, is designed to generate a new Salesforce Case record based on the user's conversation with the agent. Which set of Action Instructions should the administrator use according to best practices?", options: ["A. \"This action provides the ability to create a new case record in the Salesforce system. Its function is to simply save customer information as a record. Use this when the user wants to create a case.\"", "B. \"Use this action to create a new Salesforce Case record. The goal is to document a customer's issue in the system. Use this when the user's intent is to create a formal record of their problem or question.\"", "C. \"Creates a new case record in the system for any type of customer inquiry. The purpose of this is to ensure a record of the interaction is saved.\"", "D. \"The createCase code snippet is configured to create a case. It runs in the background to handle the user's request to log a new issue. Its purpose is to solve the customer's issue.\""], ans: ["B"], hook: "Instructions that state purpose, goal, and when to use" },
      { id: 73, req: 1, q: "A Platform Administrator is designing a prompt template for a new agent. The agent's purpose is to help service reps troubleshoot technical issues by providing concise, step-by-step instructions. Based on best practices for creating effective prompts, which approach should the administrator use?", options: ["A. Write a detailed prompt with multiple nested conditions to cover all the major troubleshooting scenarios.", "B. Use specific technical terms and abbreviations to ensure the AI understands the specialised domain.", "C. Focus on providing high-level, theoretical concepts so the AI has the flexibility to respond creatively.", "D. Use natural, easy-to-understand language and clear, concise instructions to guide the AI's behavior."], ans: ["D"], hook: "Natural, concise language" },
      { id: 76, req: 1, q: "When Agentforce performs its grounding check, it examines source information, the topic instructions, and scope. Which additional information does the agent look for during its grounding check?", options: ["A. Incompatible data types", "B. Prompt injection risks", "C. Encrypted fields", "D. The web for information verification"], ans: ["B"], hook: "Grounding check looks for prompt injection risks" },
      { id: 80, req: 1, q: "A Platform Administrator is adding a new topic to an agent. What is best practice for topic instructions?", options: ["A. Write the instructions generically to allow the agent maximum flexibility in its reasoning.", "B. Include an extended list of example user questions so the agent can learn from patterns.", "C. Keep instructions as minimal as possible to reduce agent latency.", "D. Add business-specific language rather than plain language."], ans: ["B"], hook: "Include example user questions so the agent learns from patterns (Corrected)" },
      { id: 98, req: 1, q: "A new agent is being developed to help customer service reps process customer requests for a replacement product. The agent needs to call an action that takes two inputs: productId (An 18 character ID) and reasonCode (A three-digit code). Which set of agent instructions should a Platform Administrator use?", options: ["A. Instructions for productId: \"The 18 character ID of the product.\" Instructions for reasonCode: \"A numerical code.\"", "B. Instructions for productId: \"The product ID. Retrieve this from the conversation history or the user's input.\" Instructions for reasonCode: \"The three-digit replacement reason. This is required when the product ID is present.\"", "C. Instructions for productId: \"ID from the product record.\" Instructions for reasonCode: \"Code for the reason.\"", "D. Instructions for productId: \"The 18 character ID of the product. Retrieve this from the conversation history or the user's input. Required.\" Instructions for reasonCode: \"A three-digit code that specifies the reason for replacement. This is required only when the product ID is present.\""], ans: ["D"], hook: "Describe the input, where to find it, and when it's required" },
      { id: 105, req: 1, q: "Which task is especially suited for Agentforce?", options: ["A. Single-step predefined processes", "B. Static document generation", "C. Multi-step processes that need adaption to change", "D. Tasks without decision-making"], ans: ["C"], hook: "Agentforce strength" },
      { id: 109, req: 1, q: "A Platform Administrator needs to enable Agentforce for the service team. What is the most critical prerequisite for ensuring the Service Agents have a complete and accurate view of their customers?", options: ["A. Activate Email-to-Case for the agent.", "B. Configure a new Service Console layout.", "C. Verify Data Cloud is implemented.", "D. Create new user profiles for the agent."], ans: ["C"], hook: "Complete customer view" },
      { id: 125, req: 1, q: "A Platform Administrator deactivates an agent to add a new topic and action. What happens to any ongoing user conversations with the agent?", options: ["A. The agent will pause the conversation and resume once reactivated.", "B. The agent will continue conversations using the deactivated agent until reactivated.", "C. The agent window automatically closes to prevent new messages.", "D. The agent will send a system error message as a response to any new messages."], ans: ["D"], hook: "Sends a system error message to any new messages (Corrected)" },
      { id: 140, req: 1, q: "A Platform Administrator is building an agent to help an ecommerce support team. The agent needs to call an action, named updateShippingAddress, that modifies a customer's shipping address in the system. Which set of Action Instructions should the administrator use?", options: ["A. \"Use this to update shipping information. It's used for any changes to a customer's address in the system.\"", "B. \"This action updates the customer's shipping address. It is to be used when a user wants to change their address. Only use this when a customer does not have an active order in the system.\"", "C. \"This action allows for the changing of a shipping address, and the goal is to make sure the address is current and accurate.\"", "D. \"Updates the shipping address for a customer order. The goal of the action is to modify the address on a customer's record. The agent should only use this action when the user explicitly requests to change their address.\""], ans: ["D"], hook: "State purpose, goal, and \"only when...\"" },
      { id: 141, req: 1, q: "An agent is being developed with several actions that all retrieve information from different databases: GetCustomerInfo, GetOrderDetails, GetShippingStatus. Which best practice should the administrator follow to improve these names?", options: ["A. Remove all verbs and use only nouns, such as CustomerInfo, OrderDetails, and ShippingStatus.", "B. Add the word \"Salesforce\" to the beginning of each action name to improve context for the large language model.", "C. Use a consistent naming convention by starting each action with the verb \"Get\".", "D. Use additional related verbs, such as Find, Retrieve, or Identify."], ans: ["C"], hook: "Consistent verb naming (Get...)" },
      { id: 144, req: 1, q: "What is the next step an agent performs when the tasks within an agentic loop are all unsatisfactory?", options: ["A. Provides the best answer possible with caveats", "B. Gives an error message", "C. Routes to a live agent", "D. Asks for additional information"], ans: ["D"], hook: "Agent loop fallback" },

let currentMode = "category"; // 'category' or 'mock'
let currentCatIndex = 0;
let userState = {}; // For Category Practice: key = `${catIdx}-${qId}`

// Separate state for 55-Question Mock Exam
const MOCK_COUNT = 55;
const PASS_PERCENT = 70; // 70% of 55 = 38.5 -> 39 questions
let mockQuestions = [];
let mockState = {}; // key = mockIndex (0..54)

// Fisher-Yates shuffle helper
function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function init() {
  renderNav();
  renderCategory(0);
  updateScoreUI();
  generateNewMockExam(false);
}

// ================= MODE SWITCHING =================
function switchMode(mode) {
  currentMode = mode;
  document.getElementById("tabCatBtn").classList.toggle("active", mode === "category");
  document.getElementById("tabMockBtn").classList.toggle("active", mode === "mock");

  document.getElementById("catTopBar").classList.toggle("hidden", mode !== "category");
  document.getElementById("categoryView").classList.toggle("hidden", mode !== "category");

  document.getElementById("mockTopBar").classList.toggle("hidden", mode !== "mock");
  document.getElementById("mockView").classList.toggle("hidden", mode !== "mock");

  window.scrollTo({ top: 0, behavior: "smooth" });
}

// ================= CATEGORY PRACTICE LOGIC =================
function renderNav() {
  const nav = document.getElementById("catNav");
  nav.innerHTML = "";
  QUIZ_DATA.forEach((cat, idx) => {
    const btn = document.createElement("button");
    btn.className = "cat-btn" + (idx === currentCatIndex ? " active" : "");
    btn.textContent = `${cat.category} (${cat.questions.length})`;
    btn.onclick = () => {
      currentCatIndex = idx;
      renderNav();
      renderCategory(idx);
      updateScoreUI();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };
    nav.appendChild(btn);
  });
}

function shuffleCurrentCategory() {
  QUIZ_DATA[currentCatIndex].questions = shuffleArray(QUIZ_DATA[currentCatIndex].questions);
  renderCategory(currentCatIndex);
}

function renderCategory(catIdx) {
  const cat = QUIZ_DATA[catIdx];
  document.getElementById("catTitle").textContent = `${cat.category} (${cat.questions.length} Questions)`;
  const container = document.getElementById("questionsContainer");
  container.innerHTML = "";

  cat.questions.forEach((qObj) => {
    const stateKey = `${catIdx}-${qObj.id}`;
    const saved = userState[stateKey] || { selected: [], checked: false, isCorrect: false };

    const card = document.createElement("div");
    card.className = "q-card";

    const title = document.createElement("div");
    title.className = "q-title";
    title.innerHTML = `<span class="badge">Select ${qObj.req}</span> Q${qObj.id}. ${qObj.q}`;
    card.appendChild(title);

    const optList = document.createElement("div");
    optList.className = "options-list";

    qObj.options.forEach((optText) => {
      const letter = optText.charAt(0);
      const label = document.createElement("label");
      label.className = "opt-label";
      if (saved.checked) {
        if (qObj.ans.includes(letter)) label.classList.add("correct");
        else if (saved.selected.includes(letter)) label.classList.add("wrong");
      }

      const input = document.createElement("input");
      input.type = "checkbox";
      input.value = letter;
      input.checked = saved.selected.includes(letter);
      input.disabled = saved.checked;

      input.onchange = () => {
        if (!userState[stateKey]) {
          userState[stateKey] = { selected: [], checked: false, isCorrect: false };
        }
        const sel = userState[stateKey].selected;
        if (input.checked) {
          if (!sel.includes(letter)) sel.push(letter);
        } else {
          userState[stateKey].selected = sel.filter((x) => x !== letter);
        }
      };

      const span = document.createElement("span");
      span.textContent = optText;

      label.appendChild(input);
      label.appendChild(span);
      optList.appendChild(label);
    });

    card.appendChild(optList);

    const checkBtn = document.createElement("button");
    checkBtn.className = "btn-check";
    checkBtn.textContent = saved.checked ? "Answered" : "Check Answer";
    checkBtn.disabled = saved.checked;
    checkBtn.onclick = () => checkAnswer(catIdx, qObj);
    card.appendChild(checkBtn);

    const fb = document.createElement("div");
    fb.className = "feedback" + (saved.checked ? (saved.isCorrect ? " pass" : " fail") : "");
    if (saved.checked) {
      fb.innerHTML = `${saved.isCorrect ? "✅ Correct!" : "❌ Incorrect."} <strong>Answer: ${qObj.ans.join(", ")}</strong> — <em>Memory Hook: ${qObj.hook}</em>`;
    }
    card.appendChild(fb);

    container.appendChild(card);
  });
}

function checkAnswer(catIdx, qObj) {
  const stateKey = `${catIdx}-${qObj.id}`;
  const current = userState[stateKey] || { selected: [], checked: false, isCorrect: false };
  if (current.selected.length === 0) {
    alert(`Please select ${qObj.req} option(s) first.`);
    return;
  }

  const selSorted = [...current.selected].sort().join(",");
  const ansSorted = [...qObj.ans].sort().join(",");
  current.checked = true;
  current.isCorrect = selSorted === ansSorted;
  userState[stateKey] = current;

  renderCategory(catIdx);
  updateScoreUI();
}

function updateScoreUI() {
  const cat = QUIZ_DATA[currentCatIndex];
  let catAnswered = 0;
  let catCorrect = 0;
  cat.questions.forEach((qObj) => {
    const st = userState[`${currentCatIndex}-${qObj.id}`];
    if (st && st.checked) {
      catAnswered++;
      if (st.isCorrect) catCorrect++;
    }
  });
  const catPct = catAnswered > 0 ? Math.round((catCorrect / catAnswered) * 100) : 0;
  document.getElementById("catScore").textContent = `Category: ${catCorrect} / ${catAnswered} (${catPct}%)`;

  let totalAnswered = 0;
  let totalCorrect = 0;
  QUIZ_DATA.forEach((c, cIdx) => {
    c.questions.forEach((qObj) => {
      const st = userState[`${cIdx}-${qObj.id}`];
      if (st && st.checked) {
        totalAnswered++;
        if (st.isCorrect) totalCorrect++;
      }
    });
  });
  const totalPct = totalAnswered > 0 ? Math.round((totalCorrect / totalAnswered) * 100) : 0;
  document.getElementById("totalScore").textContent = `Total: ${totalCorrect} / ${totalAnswered} (${totalPct}%)`;
}

function resetCurrentCategory() {
  const cat = QUIZ_DATA[currentCatIndex];
  cat.questions.forEach((qObj) => {
    delete userState[`${currentCatIndex}-${qObj.id}`];
  });
  renderCategory(currentCatIndex);
  updateScoreUI();
}

function resetAllCategories() {
  userState = {};
  renderCategory(currentCatIndex);
  updateScoreUI();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// ================= 55-QUESTION MOCK EXAM LOGIC =================
function generateNewMockExam(scrollTop = true) {
  const allPool = [];
  QUIZ_DATA.forEach((cat) => {
    cat.questions.forEach((qObj) => {
      allPool.push({ ...qObj, categoryName: cat.category });
    });
  });

  mockQuestions = shuffleArray(allPool).slice(0, MOCK_COUNT);
  mockState = {};
  document.getElementById("mockResultBanner").className = "mock-banner";
  document.getElementById("mockResultBanner").innerHTML = "";

  renderMockExam();
  updateMockScoreUI();
  if (scrollTop) window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderMockExam() {
  const container = document.getElementById("mockQuestionsContainer");
  container.innerHTML = "";

  mockQuestions.forEach((qObj, mIdx) => {
    const saved = mockState[mIdx] || { selected: [], checked: false, isCorrect: false };

    const card = document.createElement("div");
    card.className = "q-card";

    const title = document.createElement("div");
    title.className = "q-title";
    title.innerHTML = `<span class="badge">Mock #${mIdx + 1} • Select ${qObj.req}</span><span class="badge-cat">${qObj.categoryName}</span> (Q${qObj.id}) ${qObj.q}`;
    card.appendChild(title);

    const optList = document.createElement("div");
    optList.className = "options-list";

    qObj.options.forEach((optText) => {
      const letter = optText.charAt(0);
      const label = document.createElement("label");
      label.className = "opt-label";
      if (saved.checked) {
        if (qObj.ans.includes(letter)) label.classList.add("correct");
        else if (saved.selected.includes(letter)) label.classList.add("wrong");
      }

      const input = document.createElement("input");
      input.type = "checkbox";
      input.value = letter;
      input.checked = saved.selected.includes(letter);
      input.disabled = saved.checked;

      input.onchange = () => {
        if (!mockState[mIdx]) {
          mockState[mIdx] = { selected: [], checked: false, isCorrect: false };
        }
        const sel = mockState[mIdx].selected;
        if (input.checked) {
          if (!sel.includes(letter)) sel.push(letter);
        } else {
          mockState[mIdx].selected = sel.filter((x) => x !== letter);
        }
        updateMockScoreUI();
      };

      const span = document.createElement("span");
      span.textContent = optText;

      label.appendChild(input);
      label.appendChild(span);
      optList.appendChild(label);
    });

    card.appendChild(optList);

    const checkBtn = document.createElement("button");
    checkBtn.className = "btn-check";
    checkBtn.textContent = saved.checked ? "Graded" : "Check Answer";
    checkBtn.disabled = saved.checked;
    checkBtn.onclick = () => checkSingleMockAnswer(mIdx);
    card.appendChild(checkBtn);

    const fb = document.createElement("div");
    fb.className = "feedback" + (saved.checked ? (saved.isCorrect ? " pass" : " fail") : "");
    if (saved.checked) {
      fb.innerHTML = `${saved.isCorrect ? "✅ Correct!" : "❌ Incorrect."} <strong>Answer: ${qObj.ans.join(", ")}</strong> — <em>Memory Hook: ${qObj.hook}</em>`;
    }
    card.appendChild(fb);

    container.appendChild(card);
  });
}

function checkSingleMockAnswer(mIdx) {
  const qObj = mockQuestions[mIdx];
  const current = mockState[mIdx] || { selected: [], checked: false, isCorrect: false };
  if (current.selected.length === 0) {
    alert(`Please select ${qObj.req} option(s) first.`);
    return;
  }

  const selSorted = [...current.selected].sort().join(",");
  const ansSorted = [...qObj.ans].sort().join(",");
  current.checked = true;
  current.isCorrect = selSorted === ansSorted;
  mockState[mIdx] = current;

  renderMockExam();
  updateMockScoreUI();
}

function gradeAllMock() {
  mockQuestions.forEach((qObj, mIdx) => {
    const current = mockState[mIdx] || { selected: [], checked: false, isCorrect: false };
    const selSorted = [...current.selected].sort().join(",");
    const ansSorted = [...qObj.ans].sort().join(",");
    current.checked = true;
    current.isCorrect = current.selected.length > 0 && selSorted === ansSorted;
    mockState[mIdx] = current;
  });

  renderMockExam();
  updateMockScoreUI(true);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function updateMockScoreUI(forceBanner = false) {
  let selectedCount = 0;
  let checkedCount = 0;
  let correctCount = 0;

  mockQuestions.forEach((_, mIdx) => {
    const st = mockState[mIdx];
    if (st) {
      if (st.selected.length > 0) selectedCount++;
      if (st.checked) {
        checkedCount++;
        if (st.isCorrect) correctCount++;
      }
    }
  });

  const pctOfTotal = ((correctCount / MOCK_COUNT) * 100).toFixed(1);
  document.getElementById("mockProgress").textContent = `Selected: ${selectedCount} / ${MOCK_COUNT} (Graded: ${checkedCount})`;
  document.getElementById("mockScore").textContent = `Score: ${correctCount} / ${MOCK_COUNT} (${pctOfTotal}%)`;

  const badge = document.getElementById("mockPassBadge");
  const passed = (correctCount / MOCK_COUNT) * 100 >= PASS_PERCENT;

  if ( passed ) {
    badge.className = "status-pill status-pass";
    badge.textContent = `✅ PASSED (${pctOfTotal}% • >= 70%)`;
  } else if (checkedCount === MOCK_COUNT) {
    badge.className = "status-pill status-fail";
    badge.textContent = `❌ FAILED (${pctOfTotal}% • Need 70% / 39)`;
  } else {
    badge.className = "status-pill status-progress";
    badge.textContent = `Pass Target: 70% (39 / 55 Correct)`;
  }

  const banner = document.getElementById("mockResultBanner");
  if (forceBanner || checkedCount === MOCK_COUNT) {
    if (passed) {
      banner.className = "mock-banner pass";
      banner.innerHTML = `<strong>🎉 Congratulations! You Passed the Mock Exam!</strong><br>You scored <strong>${correctCount} / ${MOCK_COUNT} (${pctOfTotal}%)</strong>, meeting the 70% (39/55) passing requirement.`;
    } else {
      banner.className = "mock-banner fail";
      banner.innerHTML = `<strong>📚 Keep Practicing — Not Quite at 70% Yet</strong><br>You scored <strong>${correctCount} / ${MOCK_COUNT} (${pctOfTotal}%)</strong>. You need at least <strong>39 / 55 (70%)</strong> to pass. Review the red questions below or click "New 55-Q Mock Exam" to try another set!`;
    }
  }
}

init();
</script>
